<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>볼링 밸런스 팀 짜기 슬롯머신</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background: #f0f2f5; padding: 15px; margin: 0; text-align: center; }
        .container { max-width: 650px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); position: relative; }
        
        /* 🧡 최상단 제목 및 상태창 */
        h2 { color: #ff8000; margin-bottom: 15px; }
        .status { font-size: 14px; color: #e67300; margin-bottom: 20px; font-weight: bold; background: #fff3e0; padding: 10px; border-radius: 6px; display: inline-block; border: 1px solid #ffe0b2; }
        
        /* 📱 탭 메뉴 스타일 */
        .tab-container { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; }
        .tab-btn { flex: 1; padding: 12px; background: #e0e0e0; color: #555; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .tab-btn.active { background: #ff8000; color: white; box-shadow: 0 3px 6px rgba(243, 156, 18, 0.3); }
        
        .input-group { margin: 15px 0; font-size: 16px; font-weight: bold; color: #333; }
        input[type="number"] { width: 50px; padding: 5px; font-size: 16px; text-align: center; border-radius: 4px; border: 1px solid #ccc; }
        
        /* 🧡 팀 짜기 START! 버튼 */
        button.start-bar { width: 100%; padding: 15px; background: #ff8000; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button.start-bar:active { background: #cc6600; transform: scale(0.98); }
        button.start-bar:disabled { background: #ccc; cursor: not-allowed; }
        
        .teams-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 25px; }
        
        /* 일반 팀 배정용 스타일 */
        .team-box { background: #e9ecef; border-radius: 8px; text-align: left; min-height: 100px; transition: all 0.1s ease; overflow: hidden; }
        
        /* 헤더 디자인 설정 */
        .team-title { background: #ff8000; color: white; font-weight: bold; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; }
        .team-title span { font-size: 18px; flex-shrink: 0; }
        
        /* 항목별 세로 3줄 고정 디자인 */
        .team-stats { font-size: 12px; color: white; text-align: right; line-height: 1.4; font-weight: bold; flex-shrink: 0; }
        .team-stats div { white-space: nowrap; }

        /* 게스트 배지 */
        .guest-badge { display: inline-block; background: #8e44ad; color: #fff; font-size: 11px; font-weight: bold; padding: 2px 7px; border-radius: 10px; margin-left: 5px; vertical-align: middle; }

        /* 게스트 이동 버튼 (보라색, 작게) */
        .guest-btn { background: #8e44ad; color: #fff; font-size: 10px; font-weight: bold; padding: 1px 6px; border-radius: 8px; margin-left: 4px; border: none; cursor: pointer; vertical-align: middle; white-space: nowrap; }
        .guest-btn:active { background: #7d3c98; transform: scale(0.95); }

        /* 게스트 짝짓기 섹션 */
        #pairSection { margin: 15px 0; text-align: left; }
        .pair-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; margin-bottom: 8px; cursor: pointer; font-size: 15px; font-weight: bold; color: #333; }
        .pair-row:active { background: #f5eefb; }
        .pair-with { font-size: 13px; color: #8e44ad; font-weight: bold; white-space: nowrap; }
        #pairModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        #pairBox { background: white; border-radius: 12px; padding: 20px; min-width: 250px; max-width: 90%; max-height: 80%; overflow-y: auto; text-align: center; }
        #pairTitle { font-weight: bold; font-size: 17px; margin-bottom: 15px; color: #333; }
        #pairBtns { display: flex; flex-direction: column; gap: 8px; }

        /* 게스트 이동 안내 + 팝업 */
        .move-hint { grid-column: 1 / -1; font-size: 13px; color: #8e44ad; font-weight: bold; background: #f5eefb; border: 1px solid #d7bde2; border-radius: 8px; padding: 8px; margin-bottom: 4px; }
        .member.movable { cursor: pointer; }
        .member.movable:hover { background: #f5eefb; border-radius: 4px; }
        #moveModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        #moveBox { background: white; border-radius: 12px; padding: 20px; min-width: 250px; max-width: 90%; text-align: center; }
        #moveTitle { font-weight: bold; font-size: 17px; margin-bottom: 15px; color: #333; }
        #moveBtns { display: flex; flex-direction: column; gap: 8px; }
        .move-btn { padding: 12px; background: #ff8000; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .move-btn:active { background: #cc6600; }
        .move-cancel { margin-top: 12px; padding: 10px; background: #ccc; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; width: 100%; }
        
        /* 내부 명단 여백 및 폰트 세팅 */
        .member-list { padding: 10px 12px 12px 12px; }
        .member { font-size: 15px; margin: 6px 0; color: #333; display: flex; justify-content: space-between; font-weight: bold; }
        .avg { color: #555; font-size: 13px; font-weight: normal; }

        /* 2인조 대진표 전용 모바일 테이블 스타일 */
        .match-table { width: 100%; border-collapse: collapse; background: white; font-size: 15px; }
        .match-table td { width: 50%; padding: 12px; font-weight: bold; color: #333; border-bottom: 1px solid #eee; text-align: center; }
        .match-table td:first-child { border-right: 1px solid #eee; }

        /* Avg 버튼 스타일 추가 */
        .avg-btn-top { position: absolute; top: 10px; right: 10px; padding: 6px 12px; background: #666; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .avg-btn-top.active { background: #ff8000; }
        
        /* ⚙️ 관리 버튼 스타일 (Avg와 대칭) */
        .admin-btn-top { position: absolute; top: 10px; left: 10px; padding: 6px 10px; background: #ccc; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; opacity: 0.6; }
        
        /* 에버순위 테이블 스타일 */
        .rank-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .rank-table th, .rank-table td { padding: 10px; border-bottom: 1px solid #eee; text-align: center; }

/* 수정 후 (이 코드로 변경하세요) */
.logo-container img { 
    width: 280px;      
    height: auto; 
    display: block; 
    margin: 0 auto; 
}
    </style>
</head>
<body>

<div class="container">
        <div class="logo-container">
        <img src="https://github.com/zofldu-netizen/UZA_Bowling/blob/main/KakaoTalk_20260706_155923831.png?raw=true" alt="UZA 볼링클럽">
    </div><button class="admin-btn-top" onclick="window.open('https://docs.google.com/spreadsheets/d/1QTKiTIvXQMj6DE3QJwBCuiELAD-qxtxpbGILK04jwzU/edit?usp=sharing', '_blank')">⚙️</button>
    
    <button id="avgBtn" class="avg-btn-top" onclick="switchTab('avg')">📊Avg</button>
    
    <h2>🎳 정기전 팀 배정 </h2>
    <div id="loadStatus" class="status">🔄 구글 API 보안 채널 연결 중...</div>
    
    <div class="tab-container">
        <button id="tabTeam" class="tab-btn active" onclick="switchTab('team')"> 정기전 팀 배정</button>
        <button id="tabPair" class="tab-btn" onclick="switchTab('pair')"> 2인조 팀 배정 (3G)</button>
    </div>
    
    <div class="input-group" id="teamInputGroup">
        목표 팀 수: <input type="number" id="tableCount" value="4" min="1"> 개 팀
    </div>
    
    <div class="input-group" id="pairInfoGroup" style="display: none; font-size: 14px; color: #666; font-weight: normal;">
        ℹ️ <strong>에버 상위 50%와 하위 50% 무작위 매칭</strong>
    </div>

    <div id="pairSection" style="display: none;">
        <div style="font-weight: bold; font-size: 15px; color: #333; margin-bottom: 8px;">👥 게스트 짝짓기</div>
        <div id="pairList"></div>
    </div>

    <button id="startBtn" class="start-bar" onclick="startShuffle()" disabled>🎰 팀 짜기 START!</button>
    
    <div class="teams-container" id="teamsDisplay"></div>
</div>

<!-- 게스트 팀 이동 팝업 -->
<div id="moveModal" onclick="closeMoveModal()">
    <div id="moveBox" onclick="event.stopPropagation()">
        <div id="moveTitle"></div>
        <div id="moveBtns"></div>
        <button class="move-cancel" onclick="closeMoveModal()">취소</button>
    </div>
</div>

<!-- 게스트 짝짓기 팝업 -->
<div id="pairModal" onclick="closePairModal()">
    <div id="pairBox" onclick="event.stopPropagation()">
        <div id="pairTitle"></div>
        <div id="pairBtns"></div>
        <button class="move-cancel" onclick="clearPairing()">짝 해제</button>
        <button class="move-cancel" onclick="closePairModal()">닫기</button>
    </div>
</div>

<script>
// 기존 원본 로직
const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbym_q0nL8Fqb0i9WWtRY7_HPXEaCABkXhTjnUV-BbAG6_4NbP6oejO8gsYjuBVFnz8LvA/exec";

let teamPlayers = [], pairPlayers = [], avgPlayers = [], fetchedPlayers = [], currentMode = 'team';

// 이름 앞 'G' = 게스트 표시. 게스트는 팀 토탈/팀Avg에서 제외되고, 그 점수만큼 팀 핸디로 들어감
function parsePlayer(rawName, avg) {
    const trimmed = String(rawName).trim();
    const isGuest = /^g/i.test(trimmed);
    const name = isGuest ? trimmed.slice(1).trim() : trimmed;
    return { name: name, avg: avg, isGuest: isGuest };
}

function guestBadge(m) {
    return m.isGuest ? `${m.name} <span class="guest-badge">게스트</span>` : m.name;
}

// 게스트 팀 이동용 상태
let currentTeams = [], isShuffling = false, moveTarget = null;

// 게스트 짝짓기 상태: { 게스트이름: 짝꿍회원이름 }
let pairings = {}, pairingGuest = null;

// 팀 토탈/팀Avg(게스트 제외) + 핸디 재계산. 게스트가 빠진 만큼 기존 공식이 게스트 점수만큼 핸디를 올려줌
function recalcTeams(teams) {
    teams.forEach(t => {
        const scorers = t.members.filter(m => !m.isGuest);
        if (scorers.length > 0) {
            t.totalSum = Math.round(scorers.reduce((a, b) => a + b.avg, 0));
            t.totalAvg = Math.round(t.totalSum / scorers.length);
        } else {
            t.totalSum = 0; t.totalAvg = 0;
        }
    });
    let max = Math.max(...teams.map(t => t.totalSum));
    teams.forEach(t => t.handicap = (max - t.totalSum < 20) ? 0 : Math.floor((max - t.totalSum) / 10) * 10);
}

function closeMoveModal() {
    document.getElementById('moveModal').style.display = 'none';
    moveTarget = null;
}

function moveGuest(toTeamId) {
    if (!moveTarget) return;
    const from = currentTeams.find(t => t.id === moveTarget.teamId);
    const to = currentTeams.find(t => t.id === toTeamId);
    const pi = moveTarget.swapMap ? moveTarget.swapMap[toTeamId] : undefined;
    if (!from || !to || pi === undefined) return;
    const gi = moveTarget.memberIdx;
    const guest = from.members[gi];
    if (!guest || !guest.isGuest) return;
    // 자리 바꾸기: 인원수는 그대로 유지
    const tmp = to.members[pi];
    to.members[pi] = guest;
    from.members[gi] = tmp;
    recalcTeams(currentTeams);
    renderTeams(currentTeams, true);
    closeMoveModal();
}

// 목적지 팀에서 게스트와 에버가 가장 비슷한 회원 찾기 (게스트·짝꿍 본인 제외)
function findSwapPartner(team, guest) {
    const pairedMember = pairings[guest.name];
    let best = -1, bestDiff = Infinity;
    team.members.forEach((m, idx) => {
        if (m.isGuest || m.name === pairedMember) return;
        const d = Math.abs(m.avg - guest.avg);
        if (d < bestDiff) { bestDiff = d; best = idx; }
    });
    return best;
}

function pickMoveTarget(teamId, memberIdx) {
    if (isShuffling) return;
    const team = currentTeams.find(t => t.id === teamId);
    if (!team) return;
    const m = team.members[memberIdx];
    if (!m || !m.isGuest) return; // 게스트만 이동 가능
    const btns = document.getElementById('moveBtns');
    btns.innerHTML = '';
    const swapMap = {};
    let anyTarget = false;
    currentTeams.forEach(t => {
        if (t.id === teamId) return;
        const pi = findSwapPartner(t, m);
        if (pi < 0) return;
        anyTarget = true;
        swapMap[t.id] = pi;
        const b = document.createElement('button');
        b.className = 'move-btn';
        b.innerText = `${t.id}팀으로 이동 ↔ ${t.members[pi].name}`;
        b.onclick = () => moveGuest(t.id);
        btns.appendChild(b);
    });
    if (!anyTarget) return;
    moveTarget = { teamId: teamId, memberIdx: memberIdx, swapMap: swapMap };
    document.getElementById('moveTitle').innerText = `${m.name}님 자리 바꾸기`;
    document.getElementById('moveModal').style.display = 'flex';
}

// ---- 게스트 짝짓기 (팀 짜기 전) ----
function renderPairSetup() {
    const section = document.getElementById('pairSection');
    const list = document.getElementById('pairList');
    const guests = teamPlayers.filter(p => p.isGuest);
    if (currentMode !== 'team' || guests.length === 0) {
        section.style.display = 'none';
        return;
    }
    section.style.display = 'block';
    list.innerHTML = '';
    guests.forEach(g => {
        const row = document.createElement('div');
        row.className = 'pair-row';
        const paired = pairings[g.name];
        row.innerHTML = `<span>${g.name} <span class="guest-badge">게스트</span></span><span class="pair-with">${paired ? '↔ ' + paired : '짝 미정'}</span>`;
        row.onclick = () => openPairPicker(g.name);
        list.appendChild(row);
    });
}

function openPairPicker(guestName) {
    pairingGuest = guestName;
    document.getElementById('pairTitle').innerText = `${guestName}의 짝꿍 선택`;
    const btns = document.getElementById('pairBtns');
    btns.innerHTML = '';
    teamPlayers.filter(p => !p.isGuest).forEach(m => {
        const b = document.createElement('button');
        b.className = 'move-btn';
        b.innerText = m.name + (pairings[guestName] === m.name ? ' ✓' : '');
        b.onclick = () => setPairing(guestName, m.name);
        btns.appendChild(b);
    });
    document.getElementById('pairModal').style.display = 'flex';
}

function setPairing(guestName, memberName) {
    pairings[guestName] = memberName;
    closePairModal();
    renderPairSetup();
}

function clearPairing() {
    if (pairingGuest) delete pairings[pairingGuest];
    closePairModal();
    renderPairSetup();
}

function closePairModal() {
    document.getElementById('pairModal').style.display = 'none';
    pairingGuest = null;
}

// 팀 배정 후 짝꿍이 다른 팀이면 자리 바꾸기로 같은 팀에 묶기 (인원수 유지)
function enforcePairings(teams) {
    Object.entries(pairings).forEach(([gName, mName]) => {
        const gTeam = teams.find(t => t.members.some(m => m.isGuest && m.name === gName));
        const mTeam = teams.find(t => t.members.some(m => !m.isGuest && m.name === mName));
        if (!gTeam || !mTeam || gTeam === mTeam) return;
        const gi = gTeam.members.findIndex(m => m.isGuest && m.name === gName);
        const guest = gTeam.members[gi];
        const pi = findSwapPartner(mTeam, guest);
        if (pi < 0) return;
        const tmp = mTeam.members[pi];
        mTeam.members[pi] = guest;
        gTeam.members[gi] = tmp;
    });
    recalcTeams(teams);
}

window.onload = loadGoogleSheet;

function switchTab(mode) {
    currentMode = mode;
    fetchedPlayers = (mode === 'team') ? teamPlayers : pairPlayers;
    
    document.getElementById('tabTeam').classList.toggle('active', mode === 'team');
    document.getElementById('tabPair').classList.toggle('active', mode === 'pair');
    document.getElementById('avgBtn').classList.toggle('active', mode === 'avg');
    
    document.getElementById('startBtn').style.display = (mode === 'avg') ? 'none' : 'block';
    
    const container = document.getElementById('teamsDisplay');
    container.innerHTML = '';
    
    if (mode === 'team') {
        document.getElementById('teamInputGroup').style.display = 'block';
        document.getElementById('pairInfoGroup').style.display = 'none';
        container.style.gridTemplateColumns = "repeat(2, 1fr)";
    } else if (mode === 'pair') {
        document.getElementById('teamInputGroup').style.display = 'none';
        document.getElementById('pairInfoGroup').style.display = 'block';
        container.style.gridTemplateColumns = "1fr"; 
    } else {
        document.getElementById('teamInputGroup').style.display = 'none';
        document.getElementById('pairInfoGroup').style.display = 'none';
        container.style.gridTemplateColumns = "1fr";
        renderAvg(avgPlayers);
    }
    renderPairSetup();
}

async function loadGoogleSheet() {
    try {
        const response = await fetch(GOOGLE_WEB_APP_URL);
        const data = await response.json(); 
        
        const matrix = data.mainData || data; 
        
        teamPlayers = []; pairPlayers = []; avgPlayers = [];
        
        matrix.forEach(row => {
            if (row[1] && row[2]) {
                const name = String(row[1]).trim();
                const avg = parseFloat(row[2]);
                if (name && !isNaN(avg) && avg >= 50 && avg <= 300) teamPlayers.push(parsePlayer(name, avg));
            }
            if (row[3] && row[4]) {
                const name = String(row[3]).trim();
                const avg = parseFloat(row[4]);
                if (name && !isNaN(avg) && avg >= 50 && avg <= 300) pairPlayers.push(parsePlayer(name, avg));
            }
        });

        if (data.avgData) {
            data.avgData.forEach((row, i) => {
                if (i > 0 && row[1]) avgPlayers.push({ rank: row[0], name: row[1], avg: row[2] });
            });
        }
        
        fetchedPlayers = teamPlayers;
        const guestCount = teamPlayers.filter(p => p.isGuest).length;
        document.getElementById('loadStatus').innerText = `✅ 동기화 완료! (팀 ${teamPlayers.length}명${guestCount ? `·게스트 ${guestCount}명` : ''}, 2인조 ${pairPlayers.length}명)`;
        document.getElementById('startBtn').disabled = false;
        pairings = {};
        renderPairSetup();
    } catch (error) {
        document.getElementById('loadStatus').innerText = `❌ 연결 실패.`;
    }
}

function startShuffle() {
    const tableCount = parseInt(document.getElementById('tableCount').value) || 4;
    const startBtn = document.getElementById('startBtn');
    startBtn.disabled = true;
    isShuffling = true;
    closeMoveModal();
    let shuffleCount = 0;
    const interval = setInterval(() => {
        if (currentMode === 'team') renderTeams(makeBalancedTeams(tableCount, true), false);
        else renderPairs(makePairsMatch(true));
        shuffleCount++;
        if (shuffleCount > 15) {
            clearInterval(interval);
            isShuffling = false; // 최종 렌더 전에 풀어야 게스트 버튼에 onclick이 붙음
            if (currentMode === 'team') { currentTeams = makeBalancedTeams(tableCount, false); enforcePairings(currentTeams); renderTeams(currentTeams, true); }
            else renderPairs(makePairsMatch(false));
            startBtn.disabled = false;
        }
    }, 100);
}

function makeBalancedTeams(tableCount, isVisualShuffle) {
    let players = [...fetchedPlayers];
    if (isVisualShuffle) players.sort(() => Math.random() - 0.5);
    else {
        players.sort((a, b) => b.avg - a.avg);
        let randomizedPlayers = [];
        for (let i = 0; i < players.length; i += tableCount) {
            let chunk = players.slice(i, i + tableCount).sort(() => Math.random() - 0.5);
            randomizedPlayers = randomizedPlayers.concat(chunk);
        }
        players = randomizedPlayers;
    }
    let teams = Array.from({ length: tableCount }, (_, i) => ({ id: i + 1, members: [], totalSum: 0, totalAvg: 0, handicap: 0 }));
    let reverse = false;
    for (let i = 0; i < players.length; i += tableCount) {
        let chunk = players.slice(i, i + tableCount);
        if (reverse && !isVisualShuffle) chunk.reverse(); 
        chunk.forEach((p, idx) => { if (teams[idx]) teams[idx].members.push(p); });
        reverse = !reverse;
    }
    recalcTeams(teams);
    return teams;
}

function makePairsMatch(isVisualShuffle) {
    let players = [...fetchedPlayers];
    if (isVisualShuffle) {
        let games = [[], [], []];
        for (let g = 0; g < 3; g++) {
            let s = [...players].sort(() => Math.random() - 0.5);
            for (let i = 0; i < s.length; i += 2) games[g].push({ p1: s[i], p2: s[i+1] || s[i], isSolo: !s[i+1] });
        }
        return games;
    }
    players.sort((a, b) => b.avg - a.avg);
    let g1c = Math.ceil(players.length/2), g1 = players.slice(0, g1c), g2 = players.slice(g1c);
    let games = [];
    for (let g = 0; g < 3; g++) {
        let s1 = [...g1].sort(() => Math.random()-0.5), s2 = [...g2].sort(() => Math.random()-0.5);
        let pairs = [];
        for (let i = 0; i < g1c; i++) {
            if (players.length % 2 !== 0 && i === g1c - 1) pairs.push({ p1: s1[i], p2: s1[i], isSolo: true });
            else pairs.push({ p1: s1[i], p2: s2[i], isSolo: false });
        }
        games.push(pairs);
    }
    return games;
}

function renderTeams(teams, showHandicap) {
    const container = document.getElementById('teamsDisplay');
    container.innerHTML = '';
    const movable = showHandicap && !isShuffling;
    const hasGuest = teams.some(t => t.members.some(m => m.isGuest));
    if (hasGuest && movable) {
        const hint = document.createElement('div');
        hint.className = 'move-hint';
        hint.innerText = '💡 게스트 버튼을 누르면 팀을 옮길 수 있어요';
        container.appendChild(hint);
    }
    teams.forEach(t => {
        const box = document.createElement('div');
        box.className = 'team-box';
        let html = `<div class="team-title"><span>${t.id}팀</span><div class="team-stats"><div>팀Avg : ${t.totalAvg}</div><div>Total : ${t.totalSum}</div><div>핸디 : +${showHandicap ? t.handicap : 0}</div></div></div><div class="member-list">`;
        t.members.forEach((m, mi) => {
            const canMove = movable && m.isGuest;
            const nameHtml = canMove
                ? `${m.name} <button class="guest-btn" onclick="pickMoveTarget(${t.id}, ${mi})">게스트</button>`
                : guestBadge(m);
            html += `<div class="member"><span>${nameHtml}</span><span class="avg">${m.avg}</span></div>`;
        });
        box.innerHTML = html + `</div>`;
        container.appendChild(box);
    });
}

function renderPairs(games) {
    const container = document.getElementById('teamsDisplay');
    container.innerHTML = `<div style="display: flex; flex-direction: column; gap: 20px; width: 100%;">` + games.map((g, i) => `<div style="background: #ffffff; border-radius: 8px; border: 1px solid #ddd; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.06);"><div style="background: #ff8000; color: white; font-weight: bold; padding: 12px; font-size: 18px;">⚡ ${i+1}G</div><table class="match-table">${g.map((p, idx) => `<tr style="background: ${idx%2===0?'#ffffff':'#fcfcfc'};"><td>${guestBadge(p.p1)}</td><td>${p.isSolo?'<span style="color: #e74c3c; font-weight:bold;">성성복복🔥</span>':guestBadge(p.p2)}</td></tr>`).join('')}</table></div>`).join('') + `</div>`;
}

function renderAvg(data) {
    const container = document.getElementById('teamsDisplay');
    container.innerHTML = `<table class="rank-table"><thead><tr style="background:#ff8000; color:white;"><th>No</th><th>이름</th><th>Avg</th></tr></thead><tbody>${data.map(p => `<tr><td>${p.rank}</td><td>${p.name}</td><td>${p.avg}</td></tr>`).join('')}</tbody></table>`;
}
</script>
